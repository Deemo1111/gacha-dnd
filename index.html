<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undian Kartu Pertanyaan</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script> <!-- Tambahkan Anime.js -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        body {
            background: #f6f5f3;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            border: 3px solid #000;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 8px 8px 0px #000;
            text-align: center;
            width: 400px;
        }

        .logo {
            width: 300px; /* Atur lebar logo sesuai kebutuhan */
            height: auto; /* Menjaga rasio aspek */
            margin-bottom: 1.5rem; /* Jarak antara logo dan judul */
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #000;
        }

        .input-file {
            display: block;
            margin: 1rem auto;
            padding: 0.7rem 1rem;
            border: 3px solid #000;
            background: #ffdd57;
            border-radius: 0.5rem;
            box-shadow: 4px 4px 0px #000;
            cursor: pointer;
            font-weight: 600;
        }

        .button {
            background: #ff4f6d;
            color: #fff;
            border: 3px solid #000;
            padding: 0.8rem 1.5rem;
            margin-top: 1rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s ease-in-out;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        #resetButton {
            background-color: #4CAF50; /* Green */
        }

        /* Gaya untuk kartu pertanyaan */
        .name-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            transition: opacity 0.5s, transform 0.5s;
            margin: 2rem auto 0;
            padding: 2rem;
            border: 3px solid #000;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 8px 8px 0px #000;
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }


        /* Efek animasi untuk nama */
        .name-display.animate {
            transform: scale(1.1); /* Efek zoom */
            opacity: 0.8; /* Efek transparansi */
        }

        /* Toggle Switch */
        .theme-switch-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "☀️";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #2196F3;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            content: "🌙";
        }

        /* Dark Mode */
        body.dark-mode {
            background: #1a1a1a;
            color: #fff;
        }

        body.dark-mode .container {
            background: #2c2c2c;
            border-color: #fff;
            box-shadow: 8px 8px 0px #fff;
            color: #fff;
        }

        body.dark-mode h1 {
            color: #fff;
        }

        body.dark-mode .input-file {
            background: #555;
            border-color: #fff;
            color: #fff;
            box-shadow: 4px 4px 0px #fff;
        }

        body.dark-mode .button {
            background: #ff7f50;
            border-color: #fff;
            box-shadow: 4px 4px 0px #fff;
        }
        
        body.dark-mode .name-display {
            background: #333;
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round"></div>
        </label>
    </div>
    <div class="container">
        <img src="logo.png" alt="Logo Aplikasi" class="logo" />
        <h1>Undian Kartu Pertanyaan</h1>
        <input type="file" id="fileInput" class="input-file" />
        <div class="button-container">
            <button id="startButton" class="button">Mulai Undian</button>
            <button id="resetButton" class="button">Reset</button>
        </div>

		<!-- Elemen untuk menampilkan nama peserta -->
        <div class="name-display" id="nameDisplay">Kartu Pertanyaan</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
